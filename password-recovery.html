<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Solstice</title>
  <style>
    :root {
      --brand-500: #f59e0b;   /* amber */
      --brand-600: #ea7a17;   /* orange */
      --brand-700: #c2410c;   /* deep orange */
      --brand-tint: #fff7ed;  /* warm cream */
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e2dc;
      --ring: rgba(234, 122, 23, 0.28);
      --error: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 100% -10%, #fde68a55, transparent 60%),
        radial-gradient(900px 500px at -10% 110%, #fdba7455, transparent 60%),
        #fffdf9;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 32px 32px;
      box-shadow: 0 20px 50px -20px rgba(194, 65, 12, 0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
      box-shadow: 0 6px 16px -6px var(--brand-600);
    }
    .logo svg { width: 20px; height: 20px; }
    .brand-name { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }

    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { margin: 0 0 26px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .field { position: relative; }
    .field svg {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px 14px 12px 40px;
      font-size: 15px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="email"]::placeholder { color: #a8a29e; }
    input[type="email"]:focus {
      outline: none;
      border-color: var(--brand-600);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .error-msg {
      display: none;
      color: var(--error);
      font-size: 13px;
      margin-top: 7px;
    }
    .field.invalid input { border-color: var(--error); }
    .field.invalid + .error-msg { display: block; }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
      box-shadow: 0 10px 22px -10px var(--brand-600);
      transition: transform .06s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.04); }
    button:active { transform: translateY(1px); }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: var(--brand-700);
      text-decoration: none;
      font-weight: 600;
    }
    .back:hover { text-decoration: underline; }

    /* success state */
    .success {
      display: none;
      text-align: center;
    }
    .success.show { display: block; }
    .form.hide { display: none; }
    .check {
      width: 56px; height: 56px;
      margin: 4px auto 18px;
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--brand-700);
      background: var(--brand-tint);
    }
    .check svg { width: 28px; height: 28px; }
    .success strong { color: var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>
        </svg>
      </span>
      <span class="brand-name">Solstice</span>
    </div>

    <!-- Recovery form -->
    <form class="form" id="recoveryForm" novalidate>
      <h1>Forgot your password?</h1>
      <p class="sub">Enter the email tied to your account and we'll send you a secure link to reset your password.</p>

      <label for="email">Email address</label>
      <div class="field" id="emailField">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
        <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required />
      </div>
      <p class="error-msg">Please enter a valid email address.</p>

      <button type="submit">Send reset link</button>
      <a class="back" href="#">← Back to sign in</a>
    </form>

    <!-- Success state -->
    <div class="success" id="success">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <h1>Check your inbox</h1>
      <p class="sub">We've sent a reset link to <strong id="sentTo">your email</strong>. The link expires in 30 minutes.</p>
      <a class="back" href="#">← Back to sign in</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('recoveryForm');
    const field = document.getElementById('emailField');
    const email = document.getElementById('email');
    const success = document.getElementById('success');
    const sentTo = document.getElementById('sentTo');

    const isValid = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

    email.addEventListener('input', () => field.classList.remove('invalid'));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isValid(email.value)) {
        field.classList.add('invalid');
        email.focus();
        return;
      }
      // In production: POST the email to your password-reset endpoint here.
      sentTo.textContent = email.value.trim();
      form.classList.add('hide');
      success.classList.add('show');
    });
  </script>
</body>
</html>
